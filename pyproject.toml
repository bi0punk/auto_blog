[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["blog/migrations/", "auto_blog/migrations/"]
